# Example dashboard: the bill so far, what solar and a battery saved, and the cheapest plans.
#
# How to use it: make a new dashboard (Settings, Dashboards, Add dashboard), open it, choose the
# pencil, then the three dots, Raw configuration editor, and replace everything with this file.
# To add it to a dashboard you already have, paste the part from `- title: Bill` down as one
# more item under that dashboard's `views:`.
#
# Before you paste, replace `service_electricity_tariff` in every entity id with the name of your
# tariff's device (Settings, Devices & services, Utility Tariffs). One card, the daily chart, is
# `custom:apexcharts-card` from HACS. Every other card is a standard one.
# Days are priced on their own, so a standing charge is shared by the days priced.
#
# What needs a setup option:
#   Bill so far, Savings and the plan sensors need an import meter in the options.
#   Savings also needs a house consumption meter. Without it those sensors stay unknown.
views:
  - title: Bill
    path: bill
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: This bill period
            icon: mdi:receipt-text
          - type: markdown
            grid_options:
              columns: 12
            content: |-
              {% macro bar(pct, hex) -%}<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 8' preserveAspectRatio='none'%3E%3Crect width='100' height='8' rx='1.2' ry='4' fill='%23888' fill-opacity='0.18'/%3E%3Crect width='{{ pct }}' height='8' rx='1.2' ry='4' fill='%23{{ hex }}'/%3E%3C/svg%3E" width="100%" height="10" alt="">{%- endmacro %}
              {% set bill_id = 'sensor.service_electricity_tariff_bill_so_far' %}
              {% set save_id = 'sensor.service_electricity_tariff_savings_this_bill_period' %}
              {% set paid = states(bill_id) | float(0) %}
              {% set unit = state_attr(bill_id, 'unit_of_measurement') %}
              {% set without = state_attr(save_id, 'bill_without_system') | float(0) %}
              {% if not has_value(bill_id) %}
              The bill is not available yet. Set an import meter in the options.
              {% else %}
              <font size='6'><b>{{ '%.2f' | format(paid) }} {{ unit }}</b></font> &nbsp;<font color='grey'>so far</font>

              <font color='grey'>Day {{ state_attr(bill_id, 'days_priced') }} of {{ state_attr(bill_id, 'days_in_period') }}, from {{ state_attr(bill_id, 'period_start') }}.</font>
              {% if has_value(save_id) %}

              <font color='#43a047'><b>{{ '%.2f' | format(states(save_id) | float(0)) }} {{ unit }} saved</b></font> by solar and the battery so far

              {% set top = [paid, without, 0.01] | max %}
              With them {{ '%.2f' | format(paid) }} {{ unit }}
              {{ bar((100 * paid / top) | round(1), '7e57c2') }}

              Without them {{ '%.2f' | format(without) }} {{ unit }}
              {{ bar((100 * without / top) | round(1), 'ffa000') }}
              {% endif %}
              {% endif %}
          - type: custom:apexcharts-card
            grid_options:
              columns: 12
            graph_span: 14d
            span:
              end: day
            header:
              show: false
            all_series_config:
              type: column
              show:
                legend_value: false
            apex_config:
              chart:
                height: 240
              legend:
                show: true
              plotOptions:
                bar:
                  columnWidth: 70%
              dataLabels:
                enabled: false
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.service_electricity_tariff_savings_this_bill_period
                name: You paid
                color: "#7e57c2"
                data_generator: |
                  return (entity.attributes.daily || []).map((d) => [new Date(d.date).getTime(), d.paid]);
              - entity: sensor.service_electricity_tariff_savings_this_bill_period
                name: Would have paid
                color: "#ffa000"
                data_generator: |
                  return (entity.attributes.daily || []).map((d) => [new Date(d.date).getTime(), d.would_have_paid]);
          - type: tile
            entity: sensor.service_electricity_tariff_savings_share_this_bill_period
            name: Share of the bill saved
            icon: mdi:piggy-bank-outline
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.service_electricity_tariff_import_this_bill_period
            name: Imported this bill period
            icon: mdi:transmission-tower-import
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.service_electricity_tariff_plan_rank
            name: Your plan's rank
            icon: mdi:podium
            color: amber
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.service_electricity_tariff_cheapest_plan_saving
            name: Cheapest plan saving
            icon: mdi:cash-check
            color: purple
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: This bill, line by line
            icon: mdi:receipt-text-outline
          - type: markdown
            grid_options:
              columns: 12
            content: |-
              {% set e = 'sensor.service_electricity_tariff_savings_this_bill_period' %}
              {% set lines = state_attr(e, 'lines') %}
              {% set unit = state_attr(e, 'unit_of_measurement') %}
              {% if lines is none %}
              The lines are not available yet. They need a house consumption meter.
              {% else %}
              <table width="100%"><thead><tr><td><b>{{ unit }}</b></td><td align="right"><b>You paid</b></td><td align="right"><b>Would have paid</b></td><td align="right"><b>Saved</b></td></tr></thead><tbody>
              {%- for l in lines if not l.included %}
              <tr><td>{{ l.line }}</td><td align="right">{{ '%.2f' | format(l.paid) }}</td><td align="right">{{ '%.2f' | format(l.would_have_paid) }}</td><td align="right">{% if l.saved | abs >= 0.005 %}<font color="{{ '#43a047' if l.saved > 0 else '#e53935' }}">{{ '%+.2f' | format(l.saved) }}</font>{% endif %}</td></tr>
              {%- endfor %}
              <tr><td><b>Total</b></td><td align="right"><b>{{ '%.2f' | format(state_attr(e, 'bill_so_far')) }}</b></td><td align="right"><b>{{ '%.2f' | format(state_attr(e, 'bill_without_system')) }}</b></td><td align="right"><font color="#43a047"><b>{{ '%+.2f' | format(state_attr(e, 'bill_difference')) }}</b></font></td></tr>
              </tbody></table>
              {% for l in lines if l.included %}

              <font color='grey'>{{ l.line }} is already inside the lines above: {{ '%.2f' | format(l.paid) }} paid, {{ '%.2f' | format(l.would_have_paid) }} without.</font>
              {% endfor %}

              <font color='grey'>Would have paid is the same energy priced as if solar and the battery were not there.</font>
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Cheapest plans
            icon: mdi:podium
          - type: markdown
            grid_options:
              columns: 12
            content: |-
              {% macro bar(pct, hex) -%}<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 8' preserveAspectRatio='none'%3E%3Crect width='100' height='8' rx='1.2' ry='4' fill='%23888' fill-opacity='0.18'/%3E%3Crect width='{{ pct }}' height='8' rx='1.2' ry='4' fill='%23{{ hex }}'/%3E%3C/svg%3E" width="100%" height="10" alt="">{%- endmacro %}
              {% set rank = 'sensor.service_electricity_tariff_plan_rank' %}
              {% set rows = state_attr(rank, 'top_plans') %}
              {% if not rows %}
              Plans are compared once a whole bill of energy is recorded. The ranking shows here after that.
              {% else %}
              ### {{ state_attr(rank, 'summary') }}
              {% set top = [rows | map(attribute='bill') | max, 0.01] | max %}
              {% set unit = state_attr('sensor.service_electricity_tariff_cheapest_plan_saving', 'unit_of_measurement') %}
              {% for r in rows %}
              {{ r.rank }}. <b>{{ 'Your plan' if r.yours else r.plan | e }}</b> {{ '%.2f' | format(r.bill) }} {{ unit }}
              {{ bar((100 * r.bill / top) | round(1), '7e57c2' if r.yours else '43a047') }}

              {% endfor %}
              {{ state_attr(rank, 'plans_compared') }} plans in the store, priced over {{ state_attr(rank, 'period_start') }} to {{ state_attr(rank, 'period_end') }} ({{ state_attr(rank, 'days_recorded') }} days recorded). Your usage re-priced, not a bill.
              {% endif %}
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Each day
            icon: mdi:calendar-month-outline
          - type: markdown
            grid_options:
              columns: 24
            content: |-
              {% set e = 'sensor.service_electricity_tariff_savings_this_bill_period' %}
              {% set days = state_attr(e, 'daily') %}
              {% if not days %}
              No days are priced yet.
              {% else %}
              <details><summary>Show every day of this bill period</summary>

              <table width="100%"><thead><tr><td><b>Day</b></td><td align="right"><b>You paid</b></td><td align="right"><b>Would have paid</b></td><td align="right"><b>Saved</b></td></tr></thead><tbody>
              {%- for d in days | reverse %}
              <tr><td>{{ (d.date | as_datetime).strftime('%a %d %b') }}</td><td align="right">{{ '%.2f' | format(d.paid) }}</td><td align="right">{{ '%.2f' | format(d.would_have_paid) }}</td><td align="right"><font color="{{ '#43a047' if d.saved >= 0 else '#e53935' }}">{{ '%+.2f' | format(d.saved) }}</font></td></tr>
              {%- endfor %}
              </tbody></table>

              </details>
              {% endif %}
