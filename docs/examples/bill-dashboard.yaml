# Example dashboard: the bill so far, what solar and a battery saved, and the cheapest plans.
#
# How to use it: make a new dashboard (Settings, Dashboards, Add dashboard), open it, choose the
# pencil, then the three dots, Raw configuration editor, and replace everything with this file.
# To add it to a dashboard you already have, paste the part from `- title: Bill` down as one
# more item under that dashboard's `views:`.
#
# Before you paste, replace `electricity_tariff` in every entity id with the name of your
# tariff's device (Settings, Devices & services, Utility Tariffs). Only standard cards are used.
# Days are priced on their own, so a standing charge is shared by the days priced.
#
# What needs a setup option:
#   Bill so far, Savings and the plan sensors need an import meter in the options.
#   Savings also needs a house consumption meter. Without it those sensors stay unknown.
views:
  - title: Bill
    path: bill
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: This bill period
            icon: mdi:receipt-text-outline
          - type: markdown
            content: |-
              {% set bill = states('sensor.electricity_tariff_bill_so_far') %}
              {% set unit = state_attr('sensor.electricity_tariff_bill_so_far', 'unit_of_measurement') %}
              {% set saved = states('sensor.electricity_tariff_savings_this_bill_period') %}
              {% set without = state_attr('sensor.electricity_tariff_savings_this_bill_period', 'bill_without_system') %}
              {% set start = state_attr('sensor.electricity_tariff_bill_so_far', 'period_start') %}
              {% set done = state_attr('sensor.electricity_tariff_bill_so_far', 'days_priced') %}
              {% set total = state_attr('sensor.electricity_tariff_bill_so_far', 'days_in_period') %}
              {% if bill in ['unknown', 'unavailable'] %}
              The bill is not available yet. Set an import meter in the options.
              {% else %}
              ## {{ '%.2f' | format(bill | float) }} {{ unit }}

              So far. Day {{ done }} of {{ total }}, from {{ start }}.
              {% if saved not in ['unknown', 'unavailable'] and without is not none %}

              **Solar and battery saved {{ saved | float | round(2) }} {{ unit }}**

              {% set top = [without | float, 0.01] | max %}
              {% set with_bar = ((bill | float) / top * 20) | round(0) | int %}
              | | | |
              | --- | --- | ---: |
              | With them | {{ '█' * with_bar }} | {{ '%.2f' | format(bill | float) }} |
              | Without | {{ '█' * 20 }} | {{ '%.2f' | format(without | float) }} |
              {% endif %}
              {% endif %}
          - type: tile
            entity: sensor.electricity_tariff_savings_share_this_bill_period
            name: Share of the bill saved
            icon: mdi:piggy-bank-outline
            color: green
          - type: tile
            entity: sensor.electricity_tariff_import_this_bill_period
            name: Imported this bill period
            icon: mdi:transmission-tower-import
            color: blue
      - type: grid
        cards:
          - type: heading
            heading: Cheapest plans
            icon: mdi:scale-balance
          - type: markdown
            content: |-
              {% set rank = 'sensor.electricity_tariff_plan_rank' %}
              {% set plans = state_attr(rank, 'top_plans') %}
              {% set saving = states('sensor.electricity_tariff_cheapest_plan_saving') %}
              {% set unit = state_attr('sensor.electricity_tariff_cheapest_plan_saving', 'unit_of_measurement') %}
              {% if plans is none %}
              The comparison is not available yet. It needs an import meter and a whole bill of recorded energy.
              {% else %}
              {{ state_attr(rank, 'summary') }}

              | # | Plan | Bill |
              | ---: | --- | ---: |
              {% for p in plans -%}
              | {{ p.rank }} | {{ '**' ~ p.plan ~ ' (yours)**' if p.yours else p.plan }} | {{ '%.2f' | format(p.bill) }} {{ unit }} |
              {% endfor %}

              {{ state_attr(rank, 'plans_compared') }} plans compared over {{ state_attr(rank, 'period_start') }} to {{ state_attr(rank, 'period_end') }}, {{ state_attr(rank, 'days_recorded') }} days recorded.
              {% if saving not in ['unknown', 'unavailable'] and saving | float(0) != 0 %}
              The cheapest plan would have saved {{ saving | float | round(2) }} {{ unit }}.
              {% endif %}
              {% endif %}
          - type: tile
            entity: sensor.electricity_tariff_plan_rank
            name: Your plan's rank
            icon: mdi:podium
            color: amber
          - type: tile
            entity: sensor.electricity_tariff_cheapest_plan_saving
            name: Cheapest plan saving
            icon: mdi:cash-check
            color: green
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Line by line
            icon: mdi:format-list-bulleted
          - type: markdown
            content: |-
              {% set e = 'sensor.electricity_tariff_savings_this_bill_period' %}
              {% set unit = state_attr(e, 'unit_of_measurement') %}
              {% set lines = state_attr(e, 'lines') %}
              {% if lines is none %}
              The lines are not available yet.
              {% else %}
              | Line | You paid | Would have paid | Saved |
              | --- | ---: | ---: | ---: |
              {% for l in lines if not l.included -%}
              | {{ l.line }} | {{ '%.2f' | format(l.paid) }} | {{ '%.2f' | format(l.would_have_paid) }} | {{ '%+.2f' | format(l.saved) if l.saved | abs >= 0.005 else '' }} |
              {% endfor -%}
              | **Total ({{ unit }})** | **{{ '%.2f' | format(state_attr(e, 'bill_so_far')) }}** | **{{ '%.2f' | format(state_attr(e, 'bill_without_system')) }}** | **{{ '%+.2f' | format(state_attr(e, 'bill_difference')) }}** |
              {% for l in lines if l.included %}
              {{ l.line }} is already inside the lines above: {{ '%.2f' | format(l.paid) }} paid, {{ '%.2f' | format(l.would_have_paid) }} without.
              {% endfor %}
              {% endif %}
          - type: heading
            heading: Day by day
            icon: mdi:chart-bar
          - type: markdown
            content: |-
              {% set e = 'sensor.electricity_tariff_savings_this_bill_period' %}
              {% set days = state_attr(e, 'daily') %}
              {% if not days %}
              No days are priced yet.
              {% else %}
              {% set top = [days | map(attribute='would_have_paid') | max | float, 0.01] | max %}
              Newest first. The dark bar is what you paid and the light bar is the extra it would have cost.

              | Day | Paid | Would have paid | Saved | |
              | --- | ---: | ---: | ---: | --- |
              {% for d in days | reverse -%}
              {% set paid = ((d.paid / top) * 16) | round(0) | int -%}
              {% set more = [((d.would_have_paid / top) * 16) | round(0) | int - paid, 0] | max -%}
              | {{ (d.date | as_datetime).strftime('%a %d %b') }} | {{ '%.2f' | format(d.paid) }} | {{ '%.2f' | format(d.would_have_paid) }} | {{ '%+.2f' | format(d.saved) }} | {{ '█' * paid }}{{ '░' * more }} |
              {% endfor %}
              {% endif %}
