name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  # The tariffstore copy workflow starts this on the branch it pushes, because a pull request
  # opened with the built-in token does not start workflows on its own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Type check
        run: mypy --follow-imports=silent custom_components/utility_tariffs
      - name: Security scan
        run: bandit -r custom_components/utility_tariffs/ -c .bandit.yaml

  # Each plugin release pins one Home Assistant version, so a requirements file stands for one
  # Home Assistant version: the minimum in hacs.json and the latest release.
  tests:
    name: Tests (Home Assistant ${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.5.0"
            requirements: tests/requirements-floor.txt
          - home-assistant: latest
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: pip install -r ${{ matrix.requirements }}
      - name: Run tests
        run: python -m pytest tests -q

  # Early warning for the next Home Assistant release. A failure here does not fail the workflow.
  tests-beta:
    name: Tests (Home Assistant beta, not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: pip install --pre pytest-homeassistant-custom-component "utility-tariffs-lib==0.4.0"
      - name: Run tests
        run: python -m pytest tests -q
